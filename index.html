    </main>
    <script src="app.js"></script>

    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB-FZIk3MoPegDHsmDDUzl5pYCzi4AnlEQ",
    authDomain: "studentpatterns.firebaseapp.com",
    projectId: "studentpatterns",
    storageBucket: "studentpatterns.firebasestorage.app",
    messagingSenderId: "533359813954",
    appId: "1:533359813954:web:909cbdcd20733ac6e994db"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 🔹 دالة الحفظ
  async function saveResultToFirebase() {
  const finalResult = window.currentThinkingStyle || "غير محدد";

  // جلب اسم الطفل والفصل من selectedValues
  const childNameObj = selectedValues.find(v => v.key === "childName");
  const childDescObj = selectedValues.find(v => v.key === "childDesc");

  const childName = childNameObj ? childNameObj.value : "";
  const childDesc = childDescObj ? childDescObj.value : "";

  if (!childName || !childDesc) {
    alert("الرجاء إدخال اسم الطفل والفصل في أول سؤالين");
    return;
  }

  // الإجابات الصورية (كل القيم النصية التي تم اختيارها بعد اسم/فصل)
  const imageAnswers = selectedValues.filter(v => typeof v === "string");

  // كائن البيانات الذي سنخزنه
  const data = {
    name: childName,
    desc: childDesc,
    answers: imageAnswers,
    thinkingStyle: finalResult,
    createdAt: new Date()
  };

  try {
    // نحفظ نسخة عامة في collection 'results'
    const generalRefPromise = addDoc(collection(db, "results"), data);

    // نحفظ نسخة منظمة تحت classes/{classId}/results
    const classDocId = sanitizeClassName(childDesc);
    const classRefPromise = addDoc(collection(db, "classes", classDocId, "results"), data);

    // ننفّذ العمليتين بالتوازي وننتظر اكتمالهم
    await Promise.all([generalRefPromise, classRefPromise]);

    document.getElementById("saveStatus").innerText = "✅ تم حفظ النتيجة";
    alert("تم حفظ النتيجة بنجاح في Firebase");
  } catch (e) {
    console.error("Error adding document: ", e);
    document.getElementById("saveStatus").innerText = "❌ حدث خطأ أثناء الحفظ";
    alert("حدث خطأ أثناء الحفظ في Firebase");
  }
}


  // 🔹 ربط الزر
  document.getElementById("saveResultBtn").addEventListener("click", () => {
             const resultMessage = document.getElementById("resultMessage");
    resultMessage.innerText = "تم حفظ النتيجة بنجاح  " ;

    const modal = document.getElementById("myModal");
    modal.style.display = "flex";
    showCelebration();
        saveResultToFirebase();
        });


document.getElementById("noBtn").addEventListener("click", () => {
    // تأكد من حساب نمط التفكير قبل استخدامه
    const resultMessage = document.getElementById("resultMessage");
    const thinkingStyle = detectThinkingStyle(selectedValues); // احسب النمط
    resultMessage.innerText = "نمط الشخصية للطفل هو : " + thinkingStyle;

    const modal = document.getElementById("myModal");
    modal.style.display = "flex"; // عرض النافذة المنبثقة
    showCelebration();

    // حفظ النتيجة في Firebase عند التسليم
    
});

   
</script>






</body>  <!-- ربط ملف الـ JavaScript -->
